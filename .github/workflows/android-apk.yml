name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'app-v*'
    paths:
      - 'native/**'
      - 'mobile/**'
      - 'components/**'
      - 'cheesefork.js'
      - 'cheesefork*.css'
      - 'course-manager.js'
      - 'index.html'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: native
        run: npm ci --no-audit --no-fund

      - name: Assemble www and sync Capacitor
        working-directory: native
        run: |
          npm run build:www
          npx cap sync android

      - name: Prepare release signing key (optional)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: native
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          cat > keystore.properties <<EOF
          storeFile=$(pwd)/release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build APKs
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp native/android/app/build/outputs/apk/debug/*.apk dist/CheeseFork-debug.apk
          if ls native/android/app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            cp native/android/app/build/outputs/apk/release/*.apk dist/CheeseFork-release.apk
          fi
          ls -la dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: CheeseFork-apk
          path: dist/*.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
